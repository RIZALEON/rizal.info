  <style>
    html, body { margin: 0; height: 100%; background: #0a1628; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    .stage { position: fixed; inset: 0; width: 100%; height: 100%; }
    .stage picture, .stage img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; object-position: 18% 45%;
    }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-wrap: wrap; gap: .55rem 1rem;
      justify-content: center; align-items: center;
      padding: .55rem .75rem calc(.55rem + env(safe-area-inset-bottom, 0));
      background: rgba(8, 12, 20, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .bar a {
      color: rgba(230, 236, 245, 0.88);
      text-decoration: none;
      font-size: 12px; font-weight: 650;
      letter-spacing: .03em;
    }
    .bar a:hover, .bar a:focus-visible {
      color: #f0d060;
      outline: 1px solid #f0d060;
      outline-offset: 3px;
      border-radius: 3px;
    }
    .bar .brand {
      color: rgba(230, 236, 245, 0.45);
      font-size: 11px; font-weight: 600;
      letter-spacing: .1em;
      margin-right: .25rem;
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="Blue goblin guard before a terraced mountain valley at sunset">
    <picture>
      <source type="image/webp" srcset="/park-mobile.webp 780w, /park.webp 1440w" sizes="100vw">
      <source type="image/jpeg" srcset="/park-mobile.jpg 780w, /park.jpg 1440w" sizes="100vw">
      <img src="/park.jpg" alt="Blue goblin guard with horned helmet and axe before a terraced mountain valley at sunset" width="1440" height="900" decoding="async" fetchpriority="high">
    </picture>
  </div>
