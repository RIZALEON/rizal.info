<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="rizal.info — Я Garage Workshop · PROJECT Я twin mirror" />
  <meta property="og:title" content="Я · Garage Workshop · rizal.info" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rizal.info/" />
  <meta property="og:image" content="https://rizal.info/assets/room.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Я · Garage Workshop · rizal.info" />
  <meta name="twitter:image" content="https://rizal.info/assets/room.jpg" />
  <title>Я · Garage Workshop · rizal.info</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <style>
    :root {
      --clay-cream: #efe6d6;
      --bar-h: clamp(64px, 9vw, 96px);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --garage-size: calc(var(--bar-h) - 10px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #07060a;
      color: var(--clay-cream);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .redwood-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      flex: 0 0 auto;
      height: calc(var(--bar-h) + var(--safe-t));
      padding: var(--safe-t) 10px 0;
      background: #050408;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    }
    .bar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: var(--garage-size);
      z-index: 2;
    }
    .btn-garage {
      width: var(--garage-size);
      height: var(--garage-size);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 14px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, filter 0.2s ease;
      outline: 2px solid rgba(255, 200, 140, 0.55);
      outline-offset: 2px;
    }
    .btn-garage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.65));
      pointer-events: none;
    }
    .btn-garage:hover, .btn-garage:focus-visible {
      transform: translateY(-2px) scale(1.06);
      filter: brightness(1.08);
    }
    .bar-face {
      justify-self: center;
      height: calc(var(--bar-h) - 14px);
      width: min(920px, 100%);
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55));
    }
    .bar-right {
      min-width: var(--garage-size);
      text-align: right;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.55;
      padding-right: 4px;
    }
    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      isolation: isolate;
      background: #0a090c;
    }
    .room {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,210,140,0.14), transparent 55%),
        url("/assets/room.jpg") center / cover no-repeat;
      filter: saturate(1.05) contrast(1.04);
      transform-origin: 50% 55%;
    }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 48%, transparent 42%, rgba(0,0,0,0.45) 100%);
      z-index: 1;
    }
    .brand {
      position: absolute;
      top: 14px;
      left: 0; right: 0;
      z-index: 5;
      text-align: center;
      pointer-events: none;
    }
    .brand .mark {
      font-size: clamp(26px, 4.5vw, 38px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 0 #3a1210, 0 10px 28px rgba(0,0,0,0.65);
    }
    .brand .sub {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.78;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .shelf-bots {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: clamp(10px, 2.5vw, 22px);
      align-items: flex-end;
    }
    .bot-slot {
      width: clamp(52px, 9vw, 78px);
      height: clamp(52px, 9vw, 78px);
      border: 0;
      background: rgba(0,0,0,0.01);
      cursor: pointer;
      border-radius: 12px;
      position: relative;
    }
    .bot-slot:hover, .bot-slot:focus-visible {
      box-shadow: 0 0 0 2px rgba(255, 210, 140, 0.55), 0 12px 24px rgba(0,0,0,0.45);
    }
    .bot-slot .name {
      position: absolute;
      left: 50%;
      bottom: -22px;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      text-shadow: 0 2px 8px #000;
      transition: opacity 0.15s ease;
    }
    .bot-slot:hover .name, .bot-slot:focus-visible .name { opacity: 0.9; }
    .panel {
      position: absolute;
      z-index: 20;
      left: 12px; right: 12px;
      bottom: calc(72px + var(--safe-b));
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(18, 14, 16, 0.88);
      border: 1px solid rgba(255, 200, 160, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }
    .panel.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .panel h2 {
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .panel p { font-size: 14px; line-height: 1.45; opacity: 0.9; }
    .panel .row { display: flex; gap: 8px; margin-top: 12px; }
    .panel button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      color: var(--clay-cream);
    }
    .panel .primary {
      background: linear-gradient(180deg, #c24a3f, #7a241f);
    }
    .panel .ghost {
      background: rgba(255,255,255,0.08);
    }
    .links {
      position: absolute;
      z-index: 30;
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
      justify-content: center;
      align-items: center;
      padding: 0.55rem 0.75rem calc(0.55rem + var(--safe-b));
      background: rgba(8, 6, 10, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,200,140,0.12);
    }
    .links a {
      color: rgba(239, 230, 214, 0.88);
      text-decoration: none;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }
    .links a:hover, .links a:focus-visible {
      color: #f0d060;
      outline: 1px solid #f0d060;
      outline-offset: 3px;
      border-radius: 3px;
    }
    .links .brand {
      position: static;
      color: rgba(239, 230, 214, 0.45);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: none;
      pointer-events: auto;
      margin-right: 0.15rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="redwood-bar" aria-label="Magic smart redwood bar">
      <div class="bar-left">
        <button class="btn-garage" id="btnGarage" title="Garage — bot creation workshop" aria-label="Garage workshop" aria-pressed="true">
          <img src="/assets/btn-garage.png" width="86" height="86" alt="Garage workshop" />
        </button>
      </div>
      <img class="bar-face" src="/assets/redwood-bar.png" width="920" height="82" alt="" />
      <div class="bar-right" aria-hidden="true">rizal.info</div>
    </header>

    <main class="stage" id="stage" aria-label="Garage claymation room">
      <div class="room" id="room" role="img" aria-label="3D claymation Garage workshop room"></div>
      <div class="vignette"></div>
      <div class="brand">
        <div class="mark">Я</div>
        <div class="sub">Garage Workshop · rizal.info</div>
      </div>
      <div class="shelf-bots" role="list" aria-label="Housed bots on shelf">
        <button class="bot-slot" data-bot="scout" role="listitem" aria-label="Scout on shelf" title="Scout — blue bat · red horns">
          <span class="name">Scout</span>
        </button>
        <button class="bot-slot" data-bot="yamax" role="listitem" aria-label="ЯMAX on shelf" title="ЯMAX — shelf companion">
          <span class="name">ЯMAX</span>
        </button>
      </div>

      <div class="panel" id="panel" role="dialog" aria-labelledby="panelTitle">
        <h2 id="panelTitle">Bot</h2>
        <p id="panelBody"></p>
        <div class="row">
          <button type="button" class="ghost" id="panelClose">Close</button>
          <button type="button" class="primary" id="panelGo">Open</button>
        </div>
      </div>

      <nav class="links" aria-label="Public links">
        <span class="brand">Я · Garage</span>
        <a href="/open.html">Open data</a>
        <a href="/.well-known/ya-twin.json">Twin card</a>
        <a href="https://rizal.pw/">rizal.pw</a>
        <a href="https://github.com/rizalward/rizal.info">Source</a>
        <a href="https://github.com/RIZALEON/PROJECTR">PROJECTR</a>
        <a href="https://github.com/RIZALEON/RIZALBOT">RIZALBOT</a>
        <a href="https://x.com/RizaltheBot">@RizaltheBot</a>
        <a href="/park.html">Park archive</a>
      </nav>
    </main>
  </div>

<script>
  const panel = document.getElementById("panel");
  const panelTitle = document.getElementById("panelTitle");
  const panelBody = document.getElementById("panelBody");
  let currentBot = null;

  const bots = {
    scout: {
      title: "Scout",
      body: "Housed bot — blue bat · red horns. Mind, abilities, and seat open from the Garage shelf."
    },
    yamax: {
      title: "ЯMAX",
      body: "Housed bot — shelf companion. Tap Open for this bot’s seat. More figures appear as you create bots."
    }
  };

  function closePanel() {
    panel.classList.remove("open");
    currentBot = null;
  }
  function openBot(id) {
    const b = bots[id];
    if (!b) return;
    currentBot = id;
    panelTitle.textContent = b.title;
    panelBody.textContent = b.body;
    panel.classList.add("open");
  }

  document.getElementById("btnGarage").addEventListener("click", closePanel);
  document.querySelectorAll(".bot-slot").forEach(function (el) {
    el.addEventListener("click", function () { openBot(el.dataset.bot); });
  });
  document.getElementById("panelClose").addEventListener("click", closePanel);
  document.getElementById("panelGo").addEventListener("click", function () {
    if (currentBot) {
      panelBody.textContent = bots[currentBot].title + " — seated in ЯBOT Garage (Mac · iOS · Android). Open the app for the live workshop.";
    }
  });

  const room = document.getElementById("room");
  const stage = document.getElementById("stage");
  stage.addEventListener("pointermove", function (e) {
    var r = stage.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - 0.5;
    var y = (e.clientY - r.top) / r.height - 0.5;
    room.style.transform = "scale(1.04) translate(" + (x * -12) + "px, " + (y * -8) + "px)";
  });
  stage.addEventListener("pointerleave", function () { room.style.transform = ""; });
</script>
</body>
</html>
