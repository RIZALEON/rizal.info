<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — rizal.info</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0a1628; overflow: hidden; font-family: system-ui, sans-serif; }
    .stage { position: fixed; inset: 0; }
    .stage img { width: 100%; height: 100%; object-fit: cover; object-position: 18% 45%; display: block; }
    .msg {
      position: fixed; left: 0; right: 0; bottom: 3.2rem; text-align: center;
      font: 700 13px/1.3 system-ui, sans-serif; color: rgba(220,230,240,.55); letter-spacing: .06em;
    }
    .msg a { color: #f0d060; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; flex-wrap: wrap; gap: .55rem 1rem; justify-content: center;
      padding: .55rem .75rem calc(.55rem + env(safe-area-inset-bottom, 0));
      background: rgba(8, 12, 20, 0.62); border-top: 1px solid rgba(255,255,255,.08);
    }
    .bar a { color: rgba(230,236,245,.88); text-decoration: none; font-size: 12px; font-weight: 650; }
  </style>
</head>
<body>
  <div class="stage"><img src="/park.jpg" alt="" width="1440" height="900"></div>
  <p class="msg">404 · <a href="/open.html">Open data</a></p>
  <nav class="bar" aria-label="Public links">
    <a href="/">Home</a>
    <a href="/open.html">Open data</a>
    <a href="https://rizal.pw/">Mind app</a>
    <a href="https://github.com/rizalward/rizal.info">Source</a>
  </nav>
</body>
</html>
